name: Build VidDown APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to publish the GitHub Release below

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # yt-dlp, ffmpeg, and aria2c are all pulled in automatically as normal
      # Gradle dependencies now (io.github.junkfood02.youtubedl-android:
      # library/ffmpeg/aria2c, prebuilt per-ABI AARs from Maven Central) --
      # no separate fetch-and-place-in-jniLibs steps needed here anymore.

      - name: Read app version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          echo "Building version $VERSION_NAME"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: Build debug + release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Upload APKs (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: viddown-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      # A GitHub Release (not just the artifact above) is what the in-app
      # Settings > Updates > "VidDown app" check reads from -- Releases are
      # public, permanent links; workflow artifacts require a logged-in
      # GitHub session and expire after 90 days, so they're fine as a quick
      # manual download but not as an update-check target. Re-pushing with
      # the same versionName updates this same release in place; bump
      # versionName in app/build.gradle.kts when you want a distinctly
      # versioned release instead of a rolling one.
      #
      # NOTE: the release APKs here are only actually installable if
      # VIDDOWN_KEYSTORE_PATH (and the matching password/alias secrets) are
      # set in this repo's Actions secrets -- without them, app/build.gradle.kts
      # leaves the release build type unsigned, and Android refuses to
      # install an unsigned APK on a real device (unlike debug builds, which
      # AGP auto-signs with a throwaway debug key). Unsigned release APKs
      # still upload fine here; they just won't install until signed.
      - name: Publish GitHub Release with APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: VidDown v${{ env.VERSION_NAME }}
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
